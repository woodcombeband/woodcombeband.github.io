        <h2>ebris luctus</h2>
        <p>
            <strong>verse i</strong><br>
            the more think the more you know<br>
            so bury up your face<br>
            quit searching, finding, learning<br>
            just take this ice cold case<br>
            <br>
            <strong>verse ii</strong><br>
            do you hear the drunken mourning<br>
            do you hear the empty praise<br>
            of those stuck inside a cycle<br>
            of which they can’t escape
        </p>
